# Arma el APK solo cada vez que subís cambios a GitHub (pestaña Actions → la última ejecución → "Artifacts").
name: Armar APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    # Ubuntu 24.04 trae el SDK de Android ya instalado (ubuntu-latest pasó a Ubuntu 26)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Armar APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          # le pone nombre al APK
          cp app/build/outputs/apk/debug/app-debug.apk "Pocket MMA.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket MMA APK
          path: Pocket MMA.apk

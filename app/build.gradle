plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketmma.juego'
    compileSdk 34

    defaultConfig {
        applicationId "com.pocketmma.juego"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Sirve los archivos del juego desde https://appassets.androidplatform.net (así el juego puede cambiar los colores de los peleadores)
    implementation 'androidx.webkit:webkit:1.11.0'
}
